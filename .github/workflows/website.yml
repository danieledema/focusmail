name: FocusMail website
on:
  push:
    branches: [main]
    paths:
      - 'website/focusmail/dist/**'
      - '.github/workflows/website.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: focusmail-pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/focusmail/dist
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
